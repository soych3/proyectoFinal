spring.application.name=api-techlab
spring.datasource.url=jdbc:mysql://localhost:3306/tienda?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate crea/actualiza las tablas; data.sql carga las categorías y el usuario de prueba
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
