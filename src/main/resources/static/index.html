<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techlab Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <h1 class="marca">Techlab Store</h1>
    <nav id="nav" aria-label="Principal">
      <button data-vista="productos" class="activo">Productos</button>
      <button data-vista="agregar">Agregar Producto</button>
      <button data-vista="carrito" id="btn-carrito">Carrito <span id="contador" class="contador">0</span></button>
      <button data-vista="pedidos">Pedidos</button>
      <button data-vista="salir" class="salir">Salir</button>
    </nav>
  </header>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <main>
    <!-- 1. Productos -->
    <section id="vista-productos">
      <div class="titulo-fila">
        <h2>Productos</h2>
        <label>Categoría
          <select id="filtro-categoria"><option value="">Todas</option></select>
        </label>
      </div>
      <div class="tabla-wrap" tabindex="0" role="region" aria-label="Lista de productos">
        <table>
          <thead>
            <tr><th scope="col">ID</th><th scope="col"><span class="sr-only">Imagen</span></th><th scope="col">Nombre</th><th scope="col">Precio</th><th scope="col">Categoría</th><th scope="col">Stock</th><th scope="col"><span class="sr-only">Acciones</span></th></tr>
          </thead>
          <tbody id="tabla-productos"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. Agregar producto -->
    <section id="vista-agregar" hidden>
      <h2>Agregar Producto</h2>
      <form id="form-producto" class="formulario">
        <label>Nombre <input name="nombre" required maxlength="255"></label>
        <label>Descripción <textarea name="descripcion" rows="3" maxlength="255"></textarea></label>
        <label>Precio <input name="precio" type="number" step="0.01" min="0" required></label>
        <label>Categoría <select name="categoriaId" id="select-categoria" required></select></label>
        <label>URL de Imagen <input name="imagenUrl" type="url" placeholder="https://..." maxlength="255"></label>
        <label>Cantidad en Stock <input name="stock" type="number" min="0" step="1" required></label>
        <button type="submit" class="primario">Guardar</button>
      </form>
    </section>

    <!-- 3. Carrito -->
    <section id="vista-carrito" hidden>
      <h2>Carrito</h2>
      <div id="carrito-contenido"></div>
    </section>

    <!-- 4. Pedidos -->
    <section id="vista-pedidos" hidden>
      <h2>Mis pedidos</h2>
      <div id="pedidos-contenido"></div>
    </section>

    <!-- 5. Salir -->
    <section id="vista-salir" hidden>
      <h2>Sesión finalizada</h2>
      <p>Cerraste la sesión y se vació el carrito.</p>
      <button id="btn-entrar" class="primario">Volver a entrar</button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
